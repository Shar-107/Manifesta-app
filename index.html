<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manifesta — Wish it. Manifest it.</title>
  <!-- Load React and Babel safely via CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

    body { margin: 0; background-color: #FFF8EE; }

  <script type="text/babel">
    // Deconstruct standard hooks safely from global React context
    const { useState, useEffect, useRef, useCallback } = React;

    // Mapping Lucide Icons dynamically from the window global bundle
    const Sparkles = (props) => <i data-lucide="sparkles" style={{display:'inline-flex', width:props.size||24, height:props.size||24, strokeWidth:props.strokeWidth||2, color:props.color||'currentColor', ...props.style}}></i>;
    const Gift = (props) => <i data-lucide="gift" style={{display:'inline-flex', width:props.size||24, height:props.size||24, strokeWidth:props.strokeWidth||2, color:props.color||'currentColor', ...props.style}}></i>;
    const Cake = (props) => <i data-lucide="cake" style={{display:'inline-flex', width:props.size||24, height:props.size||24, strokeWidth:props.strokeWidth||2, color:props.color||'currentColor', ...props.style}}></i>;
    const Heart = (props) => <i data-lucide="heart" style={{display:'inline-flex', width:props.size||24, height:props.size||24, strokeWidth:props.strokeWidth||2, color:props.color||'currentColor', ...props.style}}></i>;

    const Check = (props) => <i data-lucide="check" style={{display:'inline-flex', width:props.size||24, height:props.size||24, strokeWidth:props.strokeWidth||2, color:props.color||'currentColor', ...props.style}}></i>;

    const Trash2 = (props) => <i data-lucide="trash-2" style={{display:'inline-flex', width:props.size||24, height:props.size||24, strokeWidth:props.strokeWidth||2, color:props.color||'currentColor', ...props.style}}></i>;
    const Copy = (props) => <i data-lucide="copy" style={{display:'inline-flex', width:props.size||24, height:props.size||24, strokeWidth:props.strokeWidth||2, color:props.color||'currentColor', ...props.style}}></i>;
    const ArrowLeft = (props) => <i data-lucide="arrow-left" style={{display:'inline-flex', width:props.size||24, height:props.size||24, strokeWidth:props.strokeWidth||2, color:props.color||'currentColor', ...props.style}}></i>;
    const Eye = (props) => <i data-lucide="eye" style={{display:'inline-flex', width:props.size||24, height:props.size||24, strokeWidth:props.strokeWidth||2, color:props.color||'currentColor', ...props.style}}></i>;
    const EyeOff = (props) => <i data-lucide="eye-off" style={{display:'inline-flex', width:props.size||24, height:props.size||24, strokeWidth:props.strokeWidth||2, color:props.color||'currentColor', ...props.style}}></i>;
    const LogOut = (props) => <i data-lucide="log-out" style={{display:'inline-flex', width:props.size||24, height:props.size||24, strokeWidth:props.strokeWidth||2, color:props.color||'currentColor', ...props.style}}></i>;
    const Calendar = (props) => <i data-lucide="calendar" style={{display:'inline-flex', width:props.size||24, height:props.size||24, strokeWidth:props.strokeWidth||2, color:props.color||'currentColor', ...props.style}}></i>;
    const ExternalLink = (props) => <i data-lucide="external-link" style={{display:'inline-flex', width:props.size||24, height:props.size||24, strokeWidth:props.strokeWidth||2, color:props.color||'currentColor', ...props.style}}></i>;
    const ChevronRight = (props) => <i data-lucide="chevron-right" style={{display:'inline-flex', width:props.size||24, height:props.size||24, strokeWidth:props.strokeWidth||2, color:props.color||'currentColor', ...props.style}}></i>;
    const Mail = (props) => <i data-lucide="mail" style={{display:'inline-flex', width:props.size||24, height:props.size||24, strokeWidth:props.strokeWidth||2, color:props.color||'currentColor', ...props.style}}></i>;
    const Phone = (props) => <i data-lucide="phone" style={{display:'inline-flex', width:props.size||24, height:props.size||24, strokeWidth:props.strokeWidth||2, color:props.color||'currentColor', ...props.style}}></i>;
    const Lock = (props) => <i data-lucide="lock" style={{display:'inline-flex', width:props.size||24, height:props.size||24, strokeWidth:props.strokeWidth||2, color:props.color||'currentColor', ...props.style}}></i>;
    const MessageCircle = (props) => <i data-lucide="message-circle" style={{display:'inline-flex', width:props.size||24, height:props.size||24, strokeWidth:props.strokeWidth||2, color:props.color||'currentColor', ...props.style}}></i>;
    const Send = (props) => <i data-lucide="send" style={{display:'inline-flex', width:props.size||24, height:props.size||24, strokeWidth:props.strokeWidth||2, color:props.color||'currentColor', ...props.style}}></i>;
    const UserIcon = (props) => <i data-lucide="user" style={{display:'inline-flex', width:props.size||24, height:props.size||24, strokeWidth:props.strokeWidth||2, color:props.color||'currentColor', ...props.style}}></i>;
    const Baby = (props) => <i data-lucide="baby" style={{display:'inline-flex', width:props.size||24, height:props.size||24, strokeWidth:props.strokeWidth||2, color:props.color||'currentColor', ...props.style}}></i>;
    const Flower2 = (props) => <i data-lucide="flower-2" style={{display:'inline-flex', width:props.size||24, height:props.size||24, strokeWidth:props.strokeWidth||2, color:props.color||'currentColor', ...props.style}}></i>;
    const KeyRound = (props) => <i data-lucide="key-round" style={{display:'inline-flex', width:props.size||24, height:props.size||24, strokeWidth:props.strokeWidth||2, color:props.color||'currentColor', ...props.style}}></i>;
    const ShieldCheck = (props) => <i data-lucide="shield-check" style={{display:'inline-flex', width:props.size||24, height:props.size||24, strokeWidth:props.strokeWidth||2, color:props.color||'currentColor', ...props.style}}></i>;

    // Hook to refresh Lucide rendering icons whenever DOM state shifts
    const useLucideRefresh = (deps = []) => {
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, deps);
    };

    /* ---------------- palette / tokens ---------------- */
    const C = {
      ink: "#160F2E",
      ink2: "#241A46",
      cream: "#FFF8EE",
      card: "#FFFFFF",
      magenta: "#C026D3",
      coral: "#FB6B4A",
      gold: "#FBBF24",
      text: "#1F1730",
      muted: "#8B7FA3",
      line: "#F0E6F6",
      danger: "#E1435B",
    };
    const GRAD = `linear-gradient(135deg, ${C.magenta} 0%, ${C.coral} 55%, ${C.gold} 100%)`;
    const GRAD_SOFT = `linear-gradient(135deg, rgba(192,38,212,0.12) 0%, rgba(251,107,74,0.12) 55%, rgba(251,191,36,0.12) 100%)`;

    const DISPLAY_FONT = "Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, serif";
    const BODY_FONT = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif";

    const EVENT_TYPES = [
      { id: "wedding", label: "Wedding", icon: Heart },
      { id: "self_birthday", label: "My Birthday", icon: Sparkles },
      { id: "birthday_spouse", label: "Spouse's Birthday", icon: Cake },
      { id: "birthday_kid", label: "Kid's Birthday", icon: Baby },
      { id: "birthday_parent", label: "Parent's Birthday", icon: UserIcon },
      { id: "birthday_family", label: "Family Birthday", icon: PartyPopper },
      { id: "housewarming", label: "House Warming", icon: Home },
      { id: "promotion", label: "Promotion", icon: TrendingUp },
      { id: "anniversary", label: "Anniversary", icon: Flower2 },
      { id: "other", label: "Other", icon: Gift },
    ];
    const eventMeta = (id) => EVENT_TYPES.find((e) => e.id === id) || EVENT_TYPES[EVENT_TYPES.length - 1];

    /* ---------------- tiny helpers ---------------- */
    const genId = (len = 7) => {
      const chars = "abcdefghijkmnpqrstuvwxyz23456789";
      let s = "";
      for (let i = 0; i < len; i++) s += chars[Math.floor(Math.random() * chars.length)];
      return s;
    };
    const genOtp = () => String(Math.floor(100000 + Math.random() * 900000));
    const isEmail = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim());
    const isPhone = (v) => /^[0-9]{10,15}$/.test(v.replace(/[\s+\-()]/g, ""));
    const cleanPhone = (v) => v.replace(/[\s+\-()]/g, "");

    function domainOf(url) {
      try {
        const u = new URL(/^https?:\/\//i.test(url) ? url : `https://${url}`);
        return u.hostname.replace(/^www\./, "");
      } catch {
        return null;
      }
    }
    function guessTitle(url) {
      try {
        const u = new URL(/^https?:\/\//i.test(url) ? url : `https://${url}`);
        const seg = decodeURIComponent(u.pathname.split("/").filter(Boolean).pop() || "");
        let t = seg.replace(/\.(html?|php|aspx?)$/i, "").replace(/[-_+]/g, " ").trim();
        t = t.replace(/(dp|gp|product|item|itm|ref)/gi, "").replace(/\s+/g, " ").trim();
        if (!t || t.length < 3) return u.hostname.replace(/^www\./, "").split(".")[0];
        return t.replace(/\w/g, (c) => c.toUpperCase()).slice(0, 70);
      } catch {
        return url.slice(0, 40);
      }
    }
    function tokenColors(str) {
      let h = 0;
      for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
      const hue1 = h % 360;
      const hue2 = (hue1 + 55) % 360;
      return `linear-gradient(135deg, hsl(${hue1} 70% 55%), hsl(${hue2} 75% 60%))`;
    }

    /* ---------------- Supabase Live Cloud Storage Setup ---------------- */
    const SUPABASE_URL = "https://yzbnlvttqbkqemzvzxzs.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl6Ym5sdnR0cWJrcWVtenZ6eHpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNTEyMjQsImV4cCI6MjEwMjcyNzIyNH0.9f9zvD-J3iTaD9f8eZg_r5L1T0lTM1i6cLQic1vvmf4";

    const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    const StorageEngine = {
      get: async (table, keyId) => {
        if (!supabase) {
          try {
            const item = localStorage.getItem(table + "_" + keyId);
            return item ? JSON.parse(item) : null;
          } catch { return null; }
        }
        try {
          const { data, error } = await supabase.from(table).select('*').eq('id', keyId).single();
          if (error || !data) return null;
          return JSON.parse(data.saved_data);
        } catch { return null; }
      },
      set: async (table, keyId, val) => {
        if (!supabase) {
          try { localStorage.setItem(table + "_" + keyId, JSON.stringify(val)); } catch(e) {}
          return;
        }
        try {
          await supabase.from(table).upsert({ id: keyId, saved_data: JSON.stringify(val) });
        } catch(e) { console.error("Cloud save failed:", e); }
      }
    };

    const K_USERS = "profiles";
    const K_SESSION = "manifesta_active_session";

    function WishOrb({ size = 40, spin = false }) {
      useLucideRefresh();
      return (
        <div style={{
          width: size, height: size, borderRadius: "50%",
          background: GRAD, display: "flex", alignItems: "center", justifyContent: "center",
          boxShadow: "0 4px 14px rgba(192,38,212,0.35)", flexShrink: 0,
          animation: spin ? "orbPulse 2.2s ease-in-out infinite" : "none",
        }}>
          <Sparkles size={size * 0.52} color="#fff" strokeWidth={2.2} />
        </div>
      );
    }

    function Logo({ size = 30, dark = false }) {
      return (
        <div style={{ display: "flex", alignItems: "center", gap: 9 }}>
          <WishOrb size={size} />
          <span style={{
            fontFamily: DISPLAY_FONT, fontWeight: 700, fontSize: size * 0.72,
            letterSpacing: "-0.02em", color: dark ? "#fff" : C.text,
          }}>Manifesta</span>
        </div>
      );
    }

    function GradButton({ children, onClick, disabled, type = "button", style, full = true }) {
      return (
        <button type={type} onClick={onClick} disabled={disabled} style={{
          width: full ? "100%" : "auto", background: disabled ? "#E4DCEE" : GRAD,
          color: "#fff", border: "none", borderRadius: 14, padding: "14px 20px", fontSize: 15.5,
          fontWeight: 600, fontFamily: BODY_FONT, cursor: disabled ? "not-allowed" : "pointer",
          display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
          transition: "transform 0.15s ease, box-shadow 0.15s ease",
          boxShadow: disabled ? "none" : "0 6px 16px rgba(192,38,212,0.28)", ...style,
        }}>
          {children}
        </button>
      );
    }

    function GhostButton({ children, onClick, style }) {
      return (
        <button onClick={onClick} style={{
          width: "100%", background: "transparent", color: C.text, border: `1.5px solid ${C.line}`,
          borderRadius: 14, padding: "13px 20px", fontSize: 15, fontWeight: 600, fontFamily: BODY_FONT,
          cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 8, ...style,
        }}>{children}</button>
      );
    }

    function Field({ label, icon: Icon, children }) {
      return (
        <div style={{ marginBottom: 16 }}>
          {label && <label style={{ display: "block", fontSize: 12.5, fontWeight: 700, color: C.muted, marginBottom: 6, letterSpacing: "0.02em", textTransform: "uppercase" }}>{label}</label>}
          <div style={{ position: "relative" }}>
            {Icon && <Icon size={17} color={C.muted} style={{ position: "absolute", left: 14, top: "50%", transform: "translateY(-50%)" }} />}
            {children}
          </div>
        </div>
      );
    }

    const inputStyle = (withIcon) => ({
      width: "100%", boxSizing: "border-box", padding: withIcon ? "13px 14px 13px 40px" : "13px 14px",
      borderRadius: 12, border: `1.5px solid ${C.line}`, fontSize: 15.5, fontFamily: BODY_FONT,
      color: C.text, outline: "none", background: "#FCFAFF",
    });

    function Toast({ text }) {
      useLucideRefresh([text]);
      if (!text) return null;
      return (
        <div style={{
          position: "fixed", bottom: 26, left: "50%", transform: "translateX(-50%)",
          background: C.ink, color: "#fff", padding: "11px 20px", borderRadius: 30,
          fontSize: 13.5, fontWeight: 600, boxShadow: "0 10px 30px rgba(0,0,0,0.3)",
          zIndex: 999, display: "flex", alignItems: "center", gap: 8, maxWidth: "88%",
        }}>
          <Check size={15} /> {text}
        </div>
      );
    }

    function TopBar({ title, onBack, right }) {
      useLucideRefresh();
      return (
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "18px 20px 10px" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            {onBack && (
              <button onClick={onBack} style={{ background: "#F4EEFB", border: "none", borderRadius: 10, width: 34, height: 34, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}>
                <ArrowLeft size={17} color={C.text} />
              </button>
            )}
            <span style={{ fontFamily: DISPLAY_FONT, fontSize: 19, fontWeight: 700, color: C.text }}>{title}</span>
          </div>
          {right}
        </div>
      );
    }

    function ItemPreview({ item, compact }) {
      const dom = domainOf(item.url) || "link";
      const [imgFail, setImgFail] = useState(false);
      return (
        <div style={{ display: "flex", gap: 12, alignItems: "flex-start" }}>
          <div style={{
            width: compact ? 56 : 68, height: compact ? 56 : 68, borderRadius: 14, flexShrink: 0,
            overflow: "hidden", background: tokenColors(dom), display: "flex", alignItems: "center", justifyContent: "center",
          }}>
            {item.image && !imgFail ? (
              <img src={item.image} alt="" onError={() => setImgFail(true)} style={{ width: "100%", height: "100%", objectFit: "cover" }} />
            ) : (
              <span style={{ color: "#fff", fontWeight: 800, fontSize: compact ? 20 : 24, fontFamily: DISPLAY_FONT }}>
                {dom.charAt(0).toUpperCase()}
              </span>
            )}
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 14.5, fontWeight: 700, color: C.text, lineHeight: 1.3, marginBottom: 2, wordBreak: "break-word" }}>
              {item.title || guessTitle(item.url)}
            </div>
            <div style={{ fontSize: 12, color: C.muted, marginBottom: item.price || item.note ? 4 : 0 }}>{dom}</div>
            {item.price && <div style={{ fontSize: 13.5, fontWeight: 700, color: C.coral }}>{item.price}</div>}
            {item.note && <div style={{ fontSize: 12.5, color: C.muted, marginTop: 2, fontStyle: "italic" }}>"{item.note}"</div>}
          </div>
        </div>
      );
    }

    export default function App() {
      const [booting, setBooting] = useState(true);
      const [screen, setScreen] = useState("landing");
      const [toast, setToast] = useState("");
      const toastTimer = useRef(null);

      const notify = (msg) => {
        setToast(msg);
        clearTimeout(toastTimer.current);
        toastTimer.current = setTimeout(() => setToast(""), 2200);
      };

      const [user, setUser] = useState(null);
      const [wishlists, setWishlists] = useState([]);
      const [activeWl, setActiveWl] = useState(null);

      const [authType, setAuthType] = useState("email");
      const [identifier, setIdentifier] = useState("");
      const [regName, setRegName] = useState("");
      const [otp, setOtp] = useState("");
      const [otpInput, setOtpInput] = useState("");
      const [otpErr, setOtpErr] = useState("");
      const [pw, setPw] = useState("");
      const [pw2, setPw2] = useState("");
      const [showPw, setShowPw] = useState(false);
      const [authErr, setAuthErr] = useState("");
      const [loginId, setLoginId] = useState("");
      const [loginPw, setLoginPw] = useState("");
      const [pasteLink, setPasteLink] = useState("");

      useLucideRefresh([screen]);

      useEffect(() => {
        (async () => {
          // Direct deep linking resolution for shares via clean URL router params
          const params = new URLSearchParams(window.location.search);
          const sharedWlId = params.get("w");
          if (sharedWlId) {
            const wl = await StorageEngine.get("wishlists", sharedWlId);
            if (wl) {
              setActiveWl(wl);
              setScreen("shared");
              setBooting(false);
              return;
            }
          }

          try {
            const activeUid = localStorage.getItem(K_SESSION);
            if (activeUid) {
              const u = await StorageEngine.get(K_USERS, activeUid);
              if (u) {
                setUser(u);
                const wls = await fetchWishlists(u.id, u.wishlistIds || []);
                setWishlists(wls);
                setScreen("dashboard");
              }
            }
          } catch (e) {}
          setBooting(false);
        })();
      }, []);

      async function fetchWishlists(uid, wlIds) {
        const loaded = [];
        for (const id of wlIds) {
          const wl = await StorageEngine.get("wishlists", id);
          if (wl) loaded.push(wl);
        }
        return loaded.sort((a, b) => b.createdAt - a.createdAt);
      }

      function resetAuthState() {
        setIdentifier(""); setRegName(""); setOtp(""); setOtpInput(""); setOtpErr("");
        setPw(""); setPw2(""); setAuthErr("");
      }

      async function handleSendOtp() {
        setAuthErr("");
        const val = identifier.trim();
        if (authType === "email" && !isEmail(val)) return setAuthErr("Enter a valid email address.");
        if (authType === "phone" && !isPhone(val)) return setAuthErr("Enter a valid phone number.");
        
        const uid = authType === "email" ? val.toLowerCase() : cleanPhone(val);
        const existing = await StorageEngine.get(K_USERS, uid);
        if (existing) return setAuthErr("An account already exists for this entry. Try logging in.");
        
        const code = genOtp();
        setOtp(code);
        setOtpInput("");
        setOtpErr("");
        setScreen("otp");
        notify("OTP generated");
      }

      function handleVerifyOtp() {
        if (otpInput.trim() === otp) {
          setOtpErr("");
          setScreen("set-password");
        } else {
          setOtpErr("Code doesn't match.");
        }
      }

      async function handleCreateAccount() {
        setAuthErr("");
        if (pw.length < 8) return setAuthErr("Password must be at least 8 characters.");
        if (pw !== pw2) return setAuthErr("Passwords don't match.");
        
        const uid = authType === "email" ? identifier.trim().toLowerCase() : cleanPhone(identifier.trim());
        const newUser = { id: uid, type: authType, name: regName.trim() || uid, password: pw, wishlistIds: [], createdAt: Date.now() };
        
        await StorageEngine.set(K_USERS, uid, newUser);
        setLoginId(uid);
        setScreen("registered");
      }

      async function handleLogin() {
        setAuthErr("");
        const uid = loginId.trim().toLowerCase().match(/^[0-9+\-\s()]+$/) ? cleanPhone(loginId.trim()) : loginId.trim().toLowerCase();
        const u = await StorageEngine.get(K_USERS, uid);
        if (!u || u.password !== loginPw) return setAuthErr("Incorrect credentials.");
        
        setUser(u);
        localStorage.setItem(K_SESSION, u.id);
        const wls = await fetchWishlists(u.id, u.wishlistIds || []);
        setWishlists(wls);
        resetAuthState();
        setLoginPw(""); setLoginId("");
        setScreen("dashboard");
        notify(`Welcome back, ${u.name}`);
      }

      async function handleLogout() {
        localStorage.removeItem(K_SESSION);
        setUser(null);
        setWishlists([]);
        setScreen("landing");
      }

      async function openSharedByCode(raw) {
        let code = raw.trim();
        const m = code.match(/[?&]w=([a-z0-9]+)/i);
        if (m) code = m[1];
        if (!code) return notify("Paste a valid link.");
        const wl = await StorageEngine.get("wishlists", code);
        if (!wl) return notify("Wishlist not found.");
        setActiveWl(wl);
        setScreen("shared");
      }

      async function createWishlist({ title, eventType, eventDate }) {
        const id = genId(7);
        const wl = {
          id, ownerId: user.id, ownerName: user.name,
          title: title.trim() || eventMeta(eventType).label,
          eventType, eventDate: eventDate || null, items: [], createdAt: Date.now(),
        };
        await StorageEngine.set("wishlists", id, wl);
        
        const updatedUser = { ...user, wishlistIds: [id, ...(user.wishlistIds || [])] };
        await StorageEngine.set(K_USERS, user.id, updatedUser);
        setUser(updatedUser);
        
        const wls = await fetchWishlists(updatedUser.id, updatedUser.wishlistIds);
        setWishlists(wls);
        setActiveWl(wl);
        setScreen("wl-detail");
      }

      async function updateWishlistMeta(id, patch) {
        const wl = await StorageEngine.get("wishlists", id);
        const next = { ...wl, ...patch };
        await StorageEngine.set("wishlists", id, next);
        setActiveWl(next);
        const wls = await fetchWishlists(user.id, user.wishlistIds);
        setWishlists(wls);
      }

      async function deleteWishlist(id) {
        const nextIds = (user.wishlistIds || []).filter(x => x !== id);
        const updatedUser = { ...user, wishlistIds: nextIds };
        await StorageEngine.set(K_USERS, user.id, updatedUser);
        setUser(updatedUser);
        const wls = await fetchWishlists(updatedUser.id, nextIds);
        setWishlists(wls);
        setScreen("dashboard");
        notify("Wishlist deleted");
      }

      async function saveItem(wlId, item) {
        const wl = await StorageEngine.get("wishlists", wlId);
        let items = [];
        if (item.id) {
          items = wl.items.map((it) => (it.id === item.id ? item : it));
        } else {
          items = [...wl.items, { ...item, id: genId(6) }];
        }
        const next = { ...wl, items };
        await StorageEngine.set("wishlists", wlId, next);
        setActiveWl(next);
      }

      async function removeItem(wlId, itemId) {
        const wl = await StorageEngine.get("wishlists", wlId);
        const next = { ...wl, items: wl.items.filter((i) => i.id !== itemId) };
        await StorageEngine.set("wishlists", wlId, next);
        setActiveWl(next);
      }

      async function toggleReserve(wlId, itemId, reservedBy) {
        const wl = await StorageEngine.get("wishlists", wlId);
        const next = {
          ...wl,
          items: wl.items.map((i) => i.id === itemId ? { ...i, reserved: !i.reserved, reservedBy: !i.reserved ? (reservedBy || "A friend") : null } : i),
        };
        await StorageEngine.set("wishlists", wlId, next);
        setActiveWl(next);
      }

      const shellStyle = { maxWidth: 430, margin: "0 auto", minHeight: "100vh", background: C.cream, fontFamily: BODY_FONT, position: "relative" };

      if (booting) {
        return (
          <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: C.ink }}>
            <WishOrb size={56} spin />
          </div>
        );
      }

      return (
        <div style={shellStyle}>
          {screen === "landing" && <Landing onRegister={() => { resetAuthState(); setScreen("reg-input"); }} onLogin={() => { setAuthErr(""); setScreen("login"); }} onOpenLink={openSharedByCode} pasteLink={pasteLink} setPasteLink={setPasteLink} />}
          {screen === "reg-input" && <RegisterInput authType={authType} setAuthType={setAuthType} identifier={identifier} setIdentifier={setIdentifier} err={authErr} onBack={() => setScreen("landing")} onSubmit={handleSendOtp} />}
          {screen === "otp" && <OtpScreen identifier={identifier} authType={authType} otp={otp} otpInput={otpInput} setOtpInput={setOtpInput} err={otpErr} onBack={() => setScreen("reg-input")} onVerify={handleVerifyOtp} onResend={() => { const c = genOtp(); setOtp(c); setOtpInput(""); setOtpErr(""); notify("New OTP generated"); }} />}
          {screen === "set-password" && <SetPassword name={regName} setName={setRegName} pw={pw} setPw={setPw} pw2={pw2} setPw2={setPw2} showPw={showPw} setShowPw={setShowPw} err={authErr} onBack={() => setScreen("otp")} onSubmit={handleCreateAccount} />}
          {screen === "registered" && <RegisteredScreen loginId={loginId} onContinue={() => { setAuthErr(""); setScreen("login"); }} />}
          {screen === "login" && <LoginScreen loginId={loginId} setLoginId={setLoginId} loginPw={loginPw} setLoginPw={setLoginPw} err={authErr} onBack={() => setScreen("landing")} onSubmit={handleLogin} onRegister={() => { resetAuthState(); setScreen("reg-input"); }} />}
          {screen === "dashboard" && <Dashboard user={user} wishlists={wishlists} onCreate={() => setScreen("create-wl")} onOpen={(wl) => { setActiveWl(wl); setScreen("wl-detail"); }} onLogout={handleLogout} />}
          {screen === "create-wl" && <CreateWishlist onBack={() => setScreen("dashboard")} onCreate={createWishlist} />}
          {screen === "wl-detail" && activeWl && <WishlistDetail wl={activeWl} user={user} onBack={() => setScreen("dashboard")} onSaveItem={saveItem} onRemoveItem={removeItem} onUpdateMeta={updateWishlistMeta} onDelete={deleteWishlist} notify={notify} />}
          {screen === "shared" && activeWl && <SharedView wl={activeWl} isOwner={user && activeWl.ownerId === user.id} onToggleReserve={toggleReserve} onHome={() => setScreen(user ? "dashboard" : "landing")} onStartOwn={() => { resetAuthState(); setScreen(user ? "dashboard" : "reg-input"); }} loggedIn={!!user} />}
          <Toast text={toast} />
        </div>
      );
    }

    function Landing({ onRegister, onLogin, onOpenLink, pasteLink, setPasteLink }) {
      return (
        <div style={{ minHeight: "100vh", background: C.ink }}>
          <div style={{ background: `radial-gradient(circle at 30% 0%, rgba(192,38,212,0.55), transparent 55%), ${C.ink}`, padding: "56px 26px 42px", color: "#fff" }}>
            <Logo size={32} dark />
            <div style={{ marginTop: 46 }}>
              <div style={{ fontSize: 12.5, fontWeight: 700, color: C.gold, marginBottom: 10 }}>WISH IT. MANIFEST IT. SHARE IT.</div>
              <h1 style={{ fontFamily: DISPLAY_FONT, fontSize: 38, margin: 0 }}>Every life moment deserves a wishlist.</h1>
            </div>
          </div>
          <div style={{ background: C.cream, borderRadius: "26px 26px 0 0", marginTop: -22, padding: "28px 22px 34px" }}>
            <GradButton onClick={onRegister}><Sparkles size={17} /> Get started — it's free</GradButton>
            <div style={{ height: 12 }} />
            <GhostButton onClick={onLogin}>Log in</GhostButton>
            <div style={{ display: "flex", gap: 8, marginTop: 20 }}>
              <input value={pasteLink} onChange={(e) => setPasteLink(e.target.value)} placeholder="Paste link parameter here..." style={{ ...inputStyle(false), flex: 1 }} />
              <button onClick={() => onOpenLink(pasteLink)} style={{ background: C.text, color: "#fff", border: "none", borderRadius: 12, padding: "0 18px" }}><ChevronRight size={18} /></button>
            </div>
          </div>
        </div>
      );
    }

    function RegisterInput({ authType, setAuthType, identifier, setIdentifier, err, onBack, onSubmit }) {
      return (
        <div style={{ padding: 20 }}>
          <TopBar title="Create account" onBack={onBack} />
          <ErrBox msg={err} />
          <Field label={authType === "email" ? "Email" : "Phone"} icon={authType === "email" ? Mail : Phone}>
            <input value={identifier} onChange={(e) => setIdentifier(e.target.value)} style={inputStyle(true)} />
          </Field>
          <GradButton onClick={onSubmit}>Send OTP</GradButton>
        </div>
      );
    }

    function OtpScreen({ identifier, otp, otpInput, setOtpInput, err, onBack, onVerify }) {
      return (
        <div style={{ padding: 20 }}>
          <TopBar title="Verify OTP" onBack={onBack} />
          <div style={{ padding: 12, background: '#fff', border: '1px dashed text', marginBottom: 10 }}>Demo Code: {otp}</div>
          <ErrBox msg={err} />
          <input value={otpInput} onChange={(e) => setOtpInput(e.target.value)} style={inputStyle(false)} />
          <div style={{ height: 10 }} />
          <GradButton onClick={onVerify}>Verify</GradButton>
        </div>
      );
    }

    function SetPassword({ name, setName, pw, setPw, pw2, setPw2, err, onBack, onSubmit }) {
      return (
        <div style={{ padding: 20 }}>
          <TopBar title="Set Password" onBack={onBack} />
          <ErrBox msg={err} />
          <Field label="Your Name" icon={UserIcon}><input value={name} onChange={(e) => setName(e.target.value)} style={inputStyle(true)} /></Field>
          <Field label="Password" icon={Lock}><input type="password" value={pw} onChange={(e) => setPw(e.target.value)} style={inputStyle(true)} /></Field>
          <Field label="Confirm" icon={KeyRound}><input type="password" value={pw2} onChange={(e) => setPw2(e.target.value)} style={inputStyle(true)} /></Field>
          <GradButton onClick={onSubmit}>Complete Setup</GradButton>
        </div>
      );
    }

    function RegisteredScreen({ loginId, onContinue }) {
      return (
        <div style={{ padding: 40, textAlign: "center" }}>
          <h2>Account setup complete!</h2>
          <p>Your tracking ID: {loginId}</p>
          <GradButton onClick={onContinue}>Proceed to Login</GradButton>
        </div>
      );
    }

    function LoginScreen({ loginId, setLoginId, loginPw, setLoginPw, err, onBack, onSubmit }) {
      return (
        <div style={{ padding: 20 }}>
          <TopBar title="Login" onBack={onBack} />
          <ErrBox msg={err} />
          <Field label="ID" icon={UserIcon}><input value={loginId} onChange={(e) => setLoginId(e.target.value)} style={inputStyle(true)} /></Field>
          <Field label="Password" icon={Lock}><input type="password" value={loginPw} onChange={(e) => setLoginPw(e.target.value)} style={inputStyle(true)} /></Field>
          <GradButton onClick={onSubmit}>Login</GradButton>
        </div>
      );
    }

    function Dashboard({ user, wishlists, onCreate, onOpen, onLogout }) {
      return (
        <div style={{ padding: 20 }}>
          <div style={{ display: "flex", justifyContent: "space-between" }}>
            <Logo size={26} />
            <button onClick={onLogout} style={{ border: "none", background: "none" }}><LogOut size={16} /></button>
          </div>
          <h3>Welcome, {user.name}</h3>
          <GradButton onClick={onCreate}>Create Wishlist</GradButton>
          <div style={{ marginTop: 20 }}>
            {wishlists.map(wl => (
              <div key={wl.id} onClick={() => onOpen(wl)} style={{ padding: 12, background: "#fff", marginBottom: 8, borderRadius: 10, cursor: "pointer" }}>
                <strong>{wl.title}</strong>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function CreateWishlist({ onBack, onCreate }) {
      const [title, setTitle] = useState("");
      return (
        <div style={{ padding: 20 }}>
          <TopBar title="New List" onBack={onBack} />
          <Field label="List Title"><input value={title} onChange={(e) => setTitle(e.target.value)} style={inputStyle(false)} /></Field>
          <GradButton onClick={() => onCreate({ title, eventType: "other" })}>Create</GradButton>
        </div>
      );
    }

    function WishlistDetail({ wl, onBack, onSaveItem, notify }) {
      const [showAdd, setShowAdd] = useState(false);
      const [url, setUrl] = useState("");
      const [title, setTitle] = useState("");
      const shareLink = `${window.location.origin}${window.location.pathname}?w=${wl.id}`;

      return (
        <div style={{ padding: 20 }}>
          <TopBar title={wl.title} onBack={onBack} />
          <div style={{ background: "#fff", padding: 10, marginBottom: 10 }}>
            <small>Share Link:</small>
            <input readOnly value={shareLink} style={{ width: "100%", padding: 4 }} />
            <button onClick={() => { navigator.clipboard.writeText(shareLink); notify("Link copied!"); }} style={{ marginTop: 4 }}>Copy Link</button>
          </div>
          <div>
            {wl.items.map(item => <div key={item.id} style={{ background: "#fff", padding: 10, marginBottom: 8 }}><ItemPreview item={item} /></div>)}
          </div>
          <GradButton onClick={() => setShowAdd(true)}>Add Item</GradButton>
          {showAdd && (
            <div style={{ marginTop: 10, background: "#fff", padding: 10 }}>
              <input placeholder="URL" value={url} onChange={e => setUrl(e.target.value)} style={inputStyle(false)} />
              <input placeholder="Title" value={title} onChange={e => setTitle(e.target.value)} style={inputStyle(false)} />
              <button onClick={() => { onSaveItem(wl.id, { url, title }); setShowAdd(false); }}>Save</button>
            </div>
          )}
        </div>
      );
    }

    function SharedView({ wl, onToggleReserve }) {
      return (
        <div style={{ padding: 20 }}>
          <h2>{wl.title}</h2>
          <p>Created by {wl.ownerName}</p>
          <div>
            {wl.items.map(item => (
              <div key={item.id} style={{ background: "#fff", padding: 10, marginBottom: 8 }}>
                <ItemPreview item={item} />
                <button onClick={() => onToggleReserve(wl.id, item.id, "Someone")} style={{ marginTop: 4 }}>
                  {item.reserved ? "Reserved!" : "Reserve this gift"}
                </button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function ErrBox({ msg }) {
      if (!msg) return null;
      return <div style={{ color: "red", padding: 8, background: "#fff", marginBottom: 10 }}>{msg}</div>;
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
