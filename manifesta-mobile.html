<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Manifesta — Wish it. Manifest it.</title>
  
  <!-- React and ReactDOM from CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel for runtime JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * { box-sizing: border-box; }
    body { 
      margin: 0; 
      padding: 0; 
      background-color: #F3F4F6;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    input:focus, select:focus, textarea:focus { 
      border-color: #C026D3 !important; 
      box-shadow: 0 0 0 3px rgba(192, 38, 212, 0.12); 
    }
    ::placeholder { color: #8B7FA3; opacity: 0.7; }
    
    @keyframes orbPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
    @keyframes screenIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    
    .m-screen { animation: screenIn 0.35s ease; }
    
    /* Hide scrollbars for slick mobile look */
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    /* ---------------- Design Palette ---------------- */
    const C = {
      ink: "#160F2E",
      ink2: "#241A46",
      cream: "#FFF8EE",
      card: "#FFFFFF",
      magenta: "#C026D3",
      coral: "#FB6B4A",
      gold: "#FBBF24",
      text: "#1F1730",
      muted: "#8B7FA3",
      line: "#F0E6F6",
      danger: "#E1435B",
    };
    const GRAD = `linear-gradient(135deg, ${C.magenta} 0%, ${C.coral} 55%, ${C.gold} 100%)`;
    const GRAD_SOFT = `linear-gradient(135deg, rgba(192,38,212,0.12) 0%, rgba(251,107,74,0.12) 55%, rgba(251,191,36,0.12) 100%)`;

    const DISPLAY_FONT = "Georgia, serif";
    const BODY_FONT = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";

    /* ---------------- Wishlist Occasions ---------------- */
    const EVENT_TYPES = [
      { id: "wedding", label: "Wedding", icon: "Heart" },
      { id: "self_birthday", label: "My Birthday", icon: "Sparkles" },
      { id: "birthday_spouse", label: "Spouse's Birthday", icon: "Cake" },
      { id: "birthday_kid", label: "Kid's Birthday", icon: "Baby" },
      { id: "birthday_parent", label: "Parent's Birthday", icon: "User" },
      { id: "birthday_family", label: "Family Birthday", icon: "PartyPopper" },
      { id: "housewarming", label: "House Warming", icon: "Home" },
      { id: "promotion", label: "Promotion", icon: "TrendingUp" },
      { id: "anniversary", label: "Anniversary", icon: "Flower2" },
      { id: "other", label: "Other", icon: "Gift" },
    ];
    
    const eventMeta = (id) => EVENT_TYPES.find((e) => e.id === id) || EVENT_TYPES[EVENT_TYPES.length - 1];

    /* ---------------- Lucide Icon Helper Component ---------------- */
    function Icon({ name, size = 18, color = "currentColor", style }) {
      // Dynamic rendering safely maps strings from our config to lucide components
      const IconComponent = lucide[name] || lucide.HelpCircle;
      return <IconComponent size={size} color={color} style={style} />;
    }

    /* ---------------- Data Generators ---------------- */
    const genId = (len = 7) => {
      const chars = "abcdefghijkmnpqrstuvwxyz23456789";
      let s = "";
      for (let i = 0; i < len; i++) s += chars[Math.floor(Math.random() * chars.length)];
      return s;
    };
    
    const domainOf = (url) => {
      try {
        const u = new URL(/^https?:\/\//i.test(url) ? url : `https://${url}`);
        return u.hostname.replace(/^www\./, "");
      } catch { return null; }
    };

    const guessTitle = (url) => {
      try {
        const u = new URL(/^https?:\/\//i.test(url) ? url : `https://${url}`);
        const seg = decodeURIComponent(u.pathname.split("/").filter(Boolean).pop() || "");
        let t = seg.replace(/\.(html?|php|aspx?)$/i, "").replace(/[-_+]/g, " ").trim();
        t = t.replace(/(dp|gp|product|item|itm|ref)/gi, "").replace(/\s+/g, " ").trim();
        if (!t || t.length < 3) return u.hostname.replace(/^www\./, "").split(".")[0];
        return t.replace(/\w/g, (c) => c.toUpperCase()).slice(0, 70);
      } catch { return url.slice(0, 40); }
    };

    function tokenColors(str) {
      let h = 0;
      for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
      return `linear-gradient(135deg, hsl(${h % 360} 70% 55%), hsl(${(h % 360 + 55) % 360} 75% 60%))`;
    }

    /* ---------------- Safe Engine Storage Engine (Cross-Platform) ---------------- */
    const StorageEngine = {
      get: (key) => {
        try {
          const item = localStorage.getItem(key);
          return item ? JSON.parse(item) : null;
        } catch { return null; }
      },
      set: (key, val) => {
        try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {}
      }
    };

    const K_USERS = "manifesta_users_db";
    const K_SESSION = "manifesta_active_session";
    const windexKey = (uid) => `manifesta_windex_${uid}`;
    const wlKey = (id) => `manifesta_wl_${id}`;

    /* ---------------- Small Global UI Components ---------------- */
    function WishOrb({ size = 40, spin = false }) {
      return (
        <div style={{
          width: size, height: size, borderRadius: "50%",
          background: GRAD, display: "flex", alignItems: "center", justifyContent: "center",
          boxShadow: "0 4px 14px rgba(192,38,212,0.35)", flexShrink: 0,
          animation: spin ? "orbPulse 2.2s ease-in-out infinite" : "none",
        }}>
          <Icon name="Sparkles" size={size * 0.52} color="#fff" />
        </div>
      );
    }

    function Logo({ size = 30, dark = false }) {
      return (
        <div style={{ display: "flex", alignItems: "center", gap: 9 }}>
          <WishOrb size={size} />
          <span style={{
            fontFamily: DISPLAY_FONT, fontWeight: 700, fontSize: size * 0.72,
            letterSpacing: "-0.02em", color: dark ? "#fff" : C.text,
          }}>
            Manifesta
          </span>
        </div>
      );
    }

    function GradButton({ children, onClick, disabled, type = "button", style, full = true }) {
      return (
        <button type={type} onClick={onClick} disabled={disabled}
          style={{
            width: full ? "100%" : "auto",
            background: disabled ? "#E4DCEE" : GRAD,
            color: "#fff", border: "none", borderRadius: 14,
            padding: "14px 20px", fontSize: 15.5, fontWeight: 600,
            fontFamily: BODY_FONT, cursor: disabled ? "not-allowed" : "pointer",
            display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
            transition: "transform 0.15s ease",
            boxShadow: disabled ? "none" : "0 6px 16px rgba(192,38,212,0.28)",
            ...style,
          }}>
          {children}
        </button>
      );
    }

    function GhostButton({ children, onClick, style }) {
      return (
        <button onClick={onClick}
          style={{
            width: "100%", background: "transparent", color: C.text,
            border: `1.5px solid ${C.line}`, borderRadius: 14, padding: "13px 20px",
            fontSize: 15, fontWeight: 600, fontFamily: BODY_FONT, cursor: "pointer",
            display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
            ...style,
          }}>
          {children}
        </button>
      );
    }

    function Field({ label, icon, children }) {
      return (
        <div style={{ marginBottom: 16 }}>
          {label && (
            <label style={{ display: "block", fontSize: 12.5, fontWeight: 700, color: C.muted, marginBottom: 6, letterSpacing: "0.02em", textTransform: "uppercase" }}>
              {label}
            </label>
          )}
          <div style={{ position: "relative" }}>
            {icon && <Icon name={icon} size={17} color={C.muted} style={{ position: "absolute", left: 14, top: "50%", transform: "translateY(-50%)" }} />}
            {children}
          </div>
        </div>
      );
    }

    const inputStyle = (withIcon) => ({
      width: "100%", boxSizing: "border-box",
      padding: withIcon ? "13px 14px 13px 40px" : "13px 14px",
      borderRadius: 12, border: `1.5px solid ${C.line}`, fontSize: 15.5,
      fontFamily: BODY_FONT, color: C.text, outline: "none", background: "#FCFAFF",
    });

    function Toast({ text }) {
      if (!text) return null;
      return (
        <div style={{
          position: "fixed", bottom: 26, left: "50%", transform: "translateX(-50%)",
          background: C.ink, color: "#fff", padding: "11px 20px", borderRadius: 30,
          fontSize: 13.5, fontWeight: 600, boxShadow: "0 10px 30px rgba(0,0,0,0.3)",
          zIndex: 999, display: "flex", alignItems: "center", gap: 8, maxWidth: "88%",
          animation: "toastIn 0.25s ease",
        }}>
          <Icon name="Check" size={15} /> {text}
        </div>
      );
    }

    function TopBar({ title, onBack, right }) {
      return (
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "18px 20px 10px" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            {onBack && (
              <button onClick={onBack} style={{ background: "#F4EEFB", border: "none", borderRadius: 10, width: 34, height: 34, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}>
                <Icon name="ArrowLeft" size={17} color={C.text} />
              </button>
            )}
            <span style={{ fontFamily: DISPLAY_FONT, fontSize: 19, fontWeight: 700, color: C.text }}>{title}</span>
          </div>
          {right}
        </div>
      );
    }

    function ItemPreview({ item, compact }) {
      const dom = domainOf(item.url) || "link";
      const [imgFail, setImgFail] = useState(false);
      return (
        <div style={{ display: "flex", gap: 12, alignItems: "flex-start" }}>
          <div style={{
            width: compact ? 56 : 68, height: compact ? 56 : 68, borderRadius: 14, flexShrink: 0,
            overflow: "hidden", background: tokenColors(dom), display: "flex", alignItems: "center", justifyContent: "center",
          }}>
            {item.image && !imgFail ? (
              <img src={item.image} alt="" onError={() => setImgFail(true)} style={{ width: "100%", height: "100%", objectFit: "cover" }} />
            ) : (
              <span style={{ color: "#fff", fontWeight: 800, fontSize: compact ? 20 : 24, fontFamily: DISPLAY_FONT }}>
                {dom.charAt(0).toUpperCase()}
              </span>
            )}
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 14.5, fontWeight: 700, color: C.text, lineHeight: 1.3, marginBottom: 2, wordBreak: "break-word" }}>
              {item.title || guessTitle(item.url)}
            </div>
            <div style={{ fontSize: 12, color: C.muted, marginBottom: item.price || item.note ? 4 : 0 }}>{dom}</div>
            {item.price && <div style={{ fontSize: 13.5, fontWeight: 700, color: C.coral }}>{item.price}</div>}
            {item.note && <div style={{ fontSize: 12.5, color: C.muted, marginTop: 2, fontStyle: "italic" }}>"{item.note}"</div>}
          </div>
        </div>
      );
    }

    /* =================================================================
       MAIN APPLICATION LAYOUT AND ENGINE
    ================================================================= */
    export default function App() {
      const [screen, setScreen] = useState("landing"); 
      const [toast, setToast] = useState("");
      const toastTimer = useRef(null);

      const notify = (msg) => {
        setToast(msg);
        clearTimeout(toastTimer.current);
        toastTimer.current = setTimeout(() => setToast(""), 2200);
      };

      const [user, setUser] = useState(null); 
      const [wishlists, setWishlists] = useState([]);
      const [activeWl, setActiveWl] = useState(null);

      // Registration/Auth States
      const [authType, setAuthType] = useState("email"); 
      const [identifier, setIdentifier] = useState("");
      const [regName, setRegName] = useState("");
      const [pw, setPw] = useState("");
      const [pw2, setPw2] = useState("");
      const [showPw, setShowPw] = useState(false);
      const [authErr, setAuthErr] = useState("");
      const [loginId, setLoginId] = useState("");
      const [loginPw, setLoginPw] = useState("");
      const [pasteLink, setPasteLink] = useState("");

      // Cold Bootstrap Flow
      useEffect(() => {
        // Parse shareable deep-links natively out of the browser window window address location
        const queryParams = new URLSearchParams(window.location.search);
        const sharedWlId = queryParams.get("w");
        
        if (sharedWlId) {
          const targetWl = StorageEngine.get(wlKey(sharedWlId));
          if (targetWl) {
            setActiveWl(targetWl);
            setScreen("shared");
            return;
          }
        }

        const activeSession = StorageEngine.get(K_SESSION);
        if (activeSession && activeSession.userId) {
          const registeredUsers = StorageEngine.get(K_USERS) || {};
          const foundUser = registeredUsers[activeSession.userId];
          if (foundUser) {
            setUser(foundUser);
            syncAndFetchWishlists(foundUser.id);
            setScreen("dashboard");
          }
        }
      }, []);

      const syncAndFetchWishlists = (uid) => {
        const index = StorageEngine.get(windexKey(uid)) || [];
        const records = index.map(id => StorageEngine.get(wlKey(id))).filter(Boolean);
        records.sort((a, b) => b.createdAt - a.createdAt);
        setWishlists(records);
        return records;
      };

      const handleRegistrationNext = () => {
        setAuthErr("");
        const rawId = identifier.trim();
        if (authType === "email" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(rawId)) {
          return setAuthErr("Enter a valid email address.");
        }
        if (authType === "phone" && rawId.length < 10) {
          return setAuthErr("Enter a valid mobile number.");
        }

        const calculatedUid = authType === "email" ? rawId.toLowerCase() : rawId.replace(/[\s+\-()]/g, "");
        const existingUsers = StorageEngine.get(K_USERS) || {};
        
        if (existingUsers[calculatedUid]) {
          return setAuthErr("An account already exists under this ID. Please try logging in.");
        }
        
        // Advance directly to password configuration
        setScreen("set-password");
      };

      const handleCreateAccountComplete = () => {
        setAuthErr("");
        if (pw.length < 8) return setAuthErr("Password must be at least 8 characters.");
        if (pw !== pw2) return setAuthErr("Passwords do not match.");

        const cleanId = authType === "email" ? identifier.trim().toLowerCase() : identifier.trim().replace(/[\s+\-()]/g, "");
        const totalUsers = StorageEngine.get(K_USERS) || {};

        const constructedUserObj = {
          id: cleanId,
          type: authType,
          name: regName.trim() || cleanId,
          password: pw,
          createdAt: Date.now()
        };

        totalUsers[cleanId] = constructedUserObj;
        StorageEngine.set(K_USERS, totalUsers);
        StorageEngine.set(windexKey(cleanId), []);

        // Explicitly set credentials onto local state to guarantee immediate resolution on next action
        setLoginId(cleanId);
        setLoginPw(pw);
        
        setScreen("registered");
      };

      const handleProcessLogin = () => {
        setAuthErr("");
        const formattedLoginTarget = loginId.trim().toLowerCase().match(/^[0-9+\-\s()]+$/) 
          ? loginId.trim().replace(/[\s+\-()]/g, "") 
          : loginId.trim().toLowerCase();

        const allUsersMap = StorageEngine.get(K_USERS) || {};
        const targetedUserRecord = allUsersMap[formattedLoginTarget];

        if (!targetedUserRecord || targetedUserRecord.password !== loginPw) {
          return setAuthErr("Incorrect ID or password entry. Double check input parameters.");
        }

        setUser(targetedUserRecord);
        StorageEngine.set(K_SESSION, { userId: targetedUserRecord.id });
        syncAndFetchWishlists(targetedUserRecord.id);
        
        // Clean out sensitive vectors
        setLoginPw(""); 
        setAuthErr("");
        setScreen("dashboard");
        notify(`Welcome, ${targetedUserRecord.name}`);
      };

      const handleLogoutAction = () => {
        StorageEngine.set(K_SESSION, null);
        setUser(null);
        setWishlists([]);
        setScreen("landing");
      };

      const openDeepLinkCode = (rawInputText) => {
        let lookupCode = rawInputText.trim();
        // Parse codes out of appended string parameters gracefully
        if (lookupCode.includes("w=")) {
          const extracts = lookupCode.split("w=");
          lookupCode = extracts[extracts.length - 1];
        }
        
        const fetchedWl = StorageEngine.get(wlKey(lookupCode));
        if (!fetchedWl) {
          return notify("Wishlist registry record not located.");
        }
        
        setActiveWl(fetchedWl);
        setScreen("shared");
      };

      /* ---------------- Core Engine Mutation Layer ---------------- */
      const handleCreateWishlist = ({ title, eventType, eventDate }) => {
        const uniqueWlId = genId(7);
        const freshListRecord = {
          id: uniqueWlId,
          ownerId: user.id,
          ownerName: user.name,
          title: title.trim() || eventMeta(eventType).label,
          eventType,
          eventDate: eventDate || null,
          items: [],
          createdAt: Date.now()
        };

        StorageEngine.set(wlKey(uniqueWlId), freshListRecord);
        const indexList = StorageEngine.get(windexKey(user.id)) || [];
        StorageEngine.set(windexKey(user.id), [uniqueWlId, ...indexList]);
        
        syncAndFetchWishlists(user.id);
        setActiveWl(freshListRecord);
        setScreen("wl-detail");
      };

      const handleUpdateItemOnList = (wlId, completeItemObj) => {
        const targetedList = StorageEngine.get(wlKey(wlId));
        let activeItemsArray = [];
        
        if (completeItemObj.id) {
          activeItemsArray = targetedList.items.map(it => it.id === completeItemObj.id ? completeItemObj : it);
        } else {
          activeItemsArray = [...targetedList.items, { ...completeItemObj, id: genId(6) }];
        }

        const savedUpdatedWl = { ...targetedList, items: activeItemsArray };
        StorageEngine.set(wlKey(wlId), savedUpdatedWl);
        
        setActiveWl(savedUpdatedWl);
        syncAndFetchWishlists(user.id);
      };

      const handleDropItemFromList = (wlId, itemId) => {
        const targetedList = StorageEngine.get(wlKey(wlId));
        const filteredItems = targetedList.items.filter(i => i.id !== itemId);
        
        const outputModifiedWl = { ...targetedList, items: filteredItems };
        StorageEngine.set(wlKey(wlId), outputModifiedWl);
        
        setActiveWl(outputModifiedWl);
        syncAndFetchWishlists(user.id);
      };

      const handleModifyMetaSettings = (wlId, patchedPayload) => {
        const targetedList = StorageEngine.get(wlKey(wlId));
        const updatedObject = { ...targetedList, ...patchedPayload };
        
        StorageEngine.set(wlKey(wlId), updatedObject);
        setActiveWl(updatedObject);
        syncAndFetchWishlists(user.id);
      };

      const handlePurgeWholeWishlist = (wlId) => {
        const internalUserIndex = StorageEngine.get(windexKey(user.id)) || [];
        const structuralFilteredIndex = internalUserIndex.filter(id => id !== wlId);
        
        StorageEngine.set(windexKey(user.id), structuralFilteredIndex);
        syncAndFetchWishlists(user.id);
        setScreen("dashboard");
        notify("Wishlist permanent record purged");
      };

      const handleToggleReservationState = (wlId, itemId, explicitGiverName) => {
        const targetedList = StorageEngine.get(wlKey(wlId));
        const transformedItems = targetedList.items.map(i => {
          if (i.id === itemId) {
            const isCurrentlyReserved = !!i.reserved;
            return {
              ...i,
              reserved: !isCurrentlyReserved,
              reservedBy: !isCurrentlyReserved ? (explicitGiverName || "A Generous Friend") : null
            };
          }
          return i;
        });

        const unifiedResultObject = { ...targetedList, items: transformedItems };
        StorageEngine.set(wlKey(wlId), unifiedResultObject);
        setActiveWl(unifiedResultObject);
      };

      const viewContainerStyle = {
        maxWidth: 430, margin: "0 auto", minHeight: "100vh", background: C.cream,
        fontFamily: BODY_FONT, position: "relative", overflowX: "hidden",
        boxShadow: "0 0 20px rgba(0,0,0,0.1)"
      };

      return (
        <div style={viewContainerStyle}>
          {screen === "landing" && (
            <div className="m-screen" style={{ minHeight: "100vh", background: C.ink }}>
              <div style={{
                background: `radial-gradient(circle at 30% 0%, rgba(192,38,212,0.55), transparent 55%), radial-gradient(circle at 80% 20%, rgba(251,191,36,0.35), transparent 45%), ${C.ink}`,
                padding: "56px 26px 42px", color: "#fff",
              }}>
                <Logo size={32} dark />
                <div style={{ marginTop: 46 }}>
                  <div style={{ fontSize: 12.5, fontWeight: 700, letterSpacing: "0.14em", color: C.gold, textTransform: "uppercase", marginBottom: 10 }}>
                    Wish it. Manifest it. Share it.
                  </div>
                  <h1 style={{ fontFamily: DISPLAY_FONT, fontSize: 38, lineHeight: 1.12, fontWeight: 700, margin: 0, letterSpacing: "-0.01em" }}>
                    Every life moment deserves a wishlist.
                  </h1>
                  <p style={{ color: "rgba(255,255,255,0.72)", fontSize: 15, lineHeight: 1.55, marginTop: 16 }}>
                    Weddings, birthdays, house-warmings. Paste any catalog product link from anywhere, generate clean shares, and coordinate directly with friends.
                  </p>
                </div>
              </div>

              <div style={{ background: C.cream, borderRadius: "26px 26px 0 0", marginTop: -22, padding: "28px 22px 34px", position: "relative" }}>
                <GradButton onClick={() => { setAuthErr(""); setScreen("reg-input"); }}>
                  <Icon name="Sparkles" size={17} /> Get started — it's free
                </GradButton>
                <div style={{ height: 12 }} />
                <GhostButton onClick={() => { setAuthErr(""); setScreen("login"); }}>Log in</GhostButton>

                <div style={{ display: "flex", alignItems: "center", gap: 10, margin: "26px 0 16px" }}>
                  <div style={{ flex: 1, height: 1, background: C.line }} />
                  <span style={{ fontSize: 12, color: C.muted, fontWeight: 600 }}>OPEN A SHARED WISHLIST</span>
                  <div style={{ flex: 1, height: 1, background: C.line }} />
                </div>
                <div style={{ display: "flex", gap: 8 }}>
                  <input value={pasteLink} onChange={(e) => setPasteLink(e.target.value)} placeholder="Paste shared Link ID or Full Code" style={{ ...inputStyle(false), flex: 1 }} />
                  <button onClick={() => openDeepLinkCode(pasteLink)} style={{ background: C.text, color: "#fff", border: "none", borderRadius: 12, padding: "0 18px", fontWeight: 700, cursor: "pointer" }}>
                    <Icon name="ChevronRight" size={18} />
                  </button>
                </div>
              </div>
            </div>
          )}

          {screen === "reg-input" && (
            <div className="m-screen">
              <TopBar title="Create your profile" onBack={() => setScreen("landing")} />
              <div style={{ padding: "10px 22px 30px" }}>
                <div style={{ display: "flex", background: "#F4EEFB", borderRadius: 12, padding: 4, marginBottom: 18 }}>
                  {["email", "phone"].map((t) => (
                    <button key={t} onClick={() => { setAuthType(t); setIdentifier(""); }}
                      style={{
                        flex: 1, padding: "10px 0", borderRadius: 9, border: "none", fontWeight: 700, fontSize: 13.5, cursor: "pointer",
                        background: authType === t ? C.card : "transparent", color: authType === t ? C.magenta : C.muted,
                        textTransform: "capitalize",
                      }}>
                      {t === "email" ? "Email" : "Mobile number"}
                    </button>
                  ))}
                </div>
                {authErr && <div style={{ background: "#FDEDF0", color: C.danger, fontSize: 13, padding: "10px 12px", borderRadius: 10, marginBottom: 16, fontWeight: 600 }}>{authErr}</div>}
                <Field label={authType === "email" ? "Email address" : "Mobile number"} icon={authType === "email" ? "Mail" : "Phone"}>
                  <input value={identifier} onChange={(e) => setIdentifier(e.target.value)} placeholder={authType === "email" ? "you@domain.com" : "Mobile contact digits"} style={inputStyle(true)} />
                </Field>
                <GradButton onClick={handleRegistrationNext}>Next Step <Icon name="ChevronRight" size={16} /></GradButton>
              </div>
            </div>
          )}

          {screen === "set-password" && (
            <div className="m-screen">
              <TopBar title="Secure your access" onBack={() => setScreen("reg-input")} />
              <div style={{ padding: "10px 22px 30px" }}>
                {authErr && <div style={{ background: "#FDEDF0", color: C.danger, fontSize: 13, padding: "10px 12px", borderRadius: 10, marginBottom: 16, fontWeight: 600 }}>{authErr}</div>}
                <Field label="Display Name" icon="User">
                  <input value={regName} onChange={(e) => setRegName(e.target.value)} placeholder="e.g. Robin Sharma" style={inputStyle(true)} />
                </Field>
                <Field label="Create Account Password" icon="Lock">
                  <input type={showPw ? "text" : "password"} value={pw} onChange={(e) => setPw(e.target.value)} placeholder="Minimum 8 characters" style={inputStyle(true)} />
                  <button onClick={() => setShowPw(!showPw)} style={{ position: "absolute", right: 12, top: "50%", transform: "translateY(-50%)", background: "none", border: "none", cursor: "pointer" }}>
                    <Icon name={showPw ? "EyeOff" : "Eye"} size={17} color={C.muted} />
                  </button>
                </Field>
                <Field label="Confirm Account Password" icon="KeyRound">
                  <input type={showPw ? "text" : "password"} value={pw2} onChange={(e) => setPw2(e.target.value)} placeholder="Match choice password explicitly" style={inputStyle(true)} />
                </Field>
                <GradButton onClick={handleCreateAccountComplete}>Complete Configuration</GradButton>
              </div>
            </div>
          )}

          {screen === "registered" && (
            <div className="m-screen" style={{ minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 30, textAlign: "center" }}>
              <WishOrb size={64} spin />
              <h2 style={{ fontFamily: DISPLAY_FONT, fontSize: 24, marginTop: 22, marginBottom: 8, color: C.text }}>Account Ready!</h2>
              <p style={{ color: C.muted, fontSize: 14.5, marginBottom: 4 }}>Your verified Manifesta ID system signature is established.</p>
              <p style={{ fontWeight: 700, color: C.magenta, fontSize: 16, marginBottom: 26 }}>{loginId}</p>
              <GradButton onClick={handleProcessLogin} full={false} style={{ padding: "13px 34px" }}>
                Enter Dashboard Now <Icon name="ChevronRight" size={16} />
              </GradButton>
            </div>
          )}

          {screen === "login" && (
            <div className="m-screen">
              <TopBar title="Welcome back" onBack={() => setScreen("landing")} />
              <div style={{ padding: "10px 22px 30px" }}>
                {authErr && <div style={{ background: "#FDEDF0", color: C.danger, fontSize: 13, padding: "10px 12px", borderRadius: 10, marginBottom: 16, fontWeight: 600 }}>{authErr}</div>}
                <Field label="Email or Mobile Handle" icon="User">
                  <input value={loginId} onChange={(e) => setLoginId(e.target.value)} placeholder="Enter registered information handle" style={inputStyle(true)} />
                </Field>
                <Field label="Profile Password" icon="Lock">
                  <input type="password" value={loginPw} onChange={(e) => setLoginPw(e.target.value)} placeholder="Enter alphanumeric pass token" style={inputStyle(true)} />
                </Field>
                <GradButton onClick={handleProcessLogin}>Authorize Session</GradButton>
              </div>
            </div>
          )}

          {screen === "dashboard" && (
            <div className="m-screen" style={{ minHeight: "100vh", paddingBottom: 40 }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "22px 22px 4px" }}>
                <Logo size={26} />
                <button onClick={handleLogoutAction} style={{ background: "#F4EEFB", border: "none", borderRadius: 10, width: 36, height: 36, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}>
                  <Icon name="LogOut" size={16} color={C.text} />
                </button>
              </div>
              <div style={{ padding: "18px 22px 8px" }}>
                <div style={{ fontSize: 13, color: C.muted, fontWeight: 600 }}>Hello, {user?.name} 👋</div>
                <h2 style={{ fontFamily: DISPLAY_FONT, fontSize: 25, margin: "2px 0 0", color: C.text }}>Your wishlists</h2>
              </div>
              <div style={{ padding: "16px 22px" }}>
                <button onClick={() => setScreen("create-wl")} style={{
                  width: "100%", background: GRAD, border: "none", borderRadius: 18, padding: "20px",
                  display: "flex", alignItems: "center", gap: 14, cursor: "pointer", color: "#fff",
                  boxShadow: "0 10px 24px rgba(192,38,212,0.3)",
                }}>
                  <div style={{ width: 42, height: 42, borderRadius: 12, background: "rgba(255,255,255,0.22)", display: "flex", alignItems: "center", justifyContent: "center" }}>
                    <Icon name="Plus" size={22} />
                  </div>
                  <div style={{ textAlign: "left" }}>
                    <div style={{ fontWeight: 700, fontSize: 15.5 }}>Start a new wishlist</div>
                    <div style={{ fontSize: 12.5, opacity: 0.9 }}>For an anniversary, party, or major life goal</div>
                  </div>
                </button>
              </div>

              {wishlists.length === 0 ? (
                <div style={{ textAlign: "center", padding: "50px 40px", color: C.muted }}>
                  <Icon name="Gift" size={38} color={C.line} style={{ marginBottom: 10 }} />
                  <div style={{ fontSize: 14, lineHeight: 1.6 }}>No wishlists configured yet. Build your canvas!</div>
                </div>
              ) : (
                <div style={{ padding: "4px 22px", display: "flex", flexDirection: "column", gap: 12 }}>
                  {wishlists.map((wl) => {
                    const metadata = eventMeta(wl.eventType);
                    return (
                      <button key={wl.id} onClick={() => { setActiveWl(wl); setScreen("wl-detail"); }} style={{
                        display: "flex", alignItems: "center", gap: 14, background: C.card, border: `1px solid ${C.line}`,
                        borderRadius: 16, padding: "14px 16px", cursor: "pointer", textAlign: "left", width: "100%"
                      }}>
                        <div style={{ width: 46, height: 46, borderRadius: "50%", background: GRAD_SOFT, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                          <Icon name={metadata.icon} size={20} color={C.magenta} />
                        </div>
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ fontWeight: 700, fontSize: 15, color: C.text, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{wl.title}</div>
                          <div style={{ fontSize: 12.5, color: C.muted, marginTop: 2 }}>{metadata.label} · {wl.items?.length || 0} item(s)</div>
                        </div>
                        <Icon name="ChevronRight" size={18} color={C.muted} />
                      </button>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          {screen === "create-wl" && (
            <div className="m-screen">
              <TopBar title="New Wishlist Registry" onBack={() => setScreen("dashboard")} />
              <div style={{ padding: "10px 22px 30px" }}>
                <Field label="Choose Theme Core Context">
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 9, marginBottom: 12 }}>
                    {EVENT_TYPES.slice(0,6).map((e) => (
                      <button key={e.id} onClick={() => handleCreateWishlist({ title: "", eventType: e.id, eventDate: "" })}
                        style={{
                          display: "flex", flexDirection: "column", alignItems: "center", gap: 6, padding: "12px 4px",
                          borderRadius: 14, cursor: "pointer", border: `1.5px solid ${C.line}`, background: C.card,
                        }}>
                        <Icon name={e.icon} size={19} color={C.magenta} />
                        <span style={{ fontSize: 10.5, fontWeight: 700, color: C.text, textAlign: "center" }}>{e.label}</span>
                      </button>
                    ))}
                  </div>
                </Field>
              </div>
            </div>
          )}

          {screen === "wl-detail" && activeWl && (
            <WishlistDetailView 
              wl={activeWl} 
              onBack={() => setScreen("dashboard")} 
              onSaveItem={(it) => handleUpdateItemOnList(activeWl.id, it)}
              onRemoveItem={(id) => handleDropItemFromList(activeWl.id, id)}
              onDeleteWishlist={() => handlePurgeWholeWishlist(activeWl.id)}
              notify={notify}
            />
          )}

          {screen === "shared" && activeWl && (
            <div className="m-screen" style={{ minHeight: "100vh", paddingBottom: 50 }}>
              <div style={{ background: C.ink, padding: "26px 22px 30px", color: "#fff" }}>
                <button onClick={() => setScreen(user ? "dashboard" : "landing")} style={{ background: "rgba(255,255,255,0.15)", border: "none", borderRadius: 10, width: 34, height: 34, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", marginBottom: 18 }}>
                  <Icon name="ArrowLeft" size={16} color="#fff" />
                </button>
                <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                  <div style={{ width: 46, height: 46, borderRadius: "50%", background: GRAD, display: "flex", alignItems: "center", justifyContent: "center" }}>
                    <Icon name={eventMeta(activeWl.eventType).icon} size={20} color="#fff" />
                  </div>
                  <div>
                    <div style={{ fontSize: 12, opacity: 0.75 }}>{activeWl.ownerName}'s Selection</div>
                    <h2 style={{ fontFamily: DISPLAY_FONT, fontSize: 22, margin: "2px 0 0" }}>{activeWl.title}</h2>
                  </div>
                </div>
              </div>

              <div style={{ padding: "18px 22px", display: "flex", flexDirection: "column", gap: 10 }}>
                {activeWl.items.length === 0 ? (
                  <div style={{ textAlign: "center", padding: "40px 20px", color: C.muted }}>No products inside this canvas yet.</div>
                ) : activeWl.items.map((item) => (
                  <div key={item.id} style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 16, padding: 14, opacity: item.reserved ? 0.65 : 1 }}>
                    <ItemPreview item={item} />
                    <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
                      <a href={item.url} target="_blank" rel="noopener noreferrer" style={{
                        flex: 1, textAlign: "center", fontSize: 12.5, fontWeight: 700, color: C.magenta,
                        border: `1.5px solid ${C.line}`, borderRadius: 10, padding: "8px 0", textDecoration: "none",
                        display: "flex", alignItems: "center", justifyContent: "center", gap: 5,
                      }}>
                        View Link Catalog <Icon name="ExternalLink" size={12} />
                      </a>
                      <button onClick={() => {
                        const guestName = prompt("Enter your name to coordinate gift coordination allocation:", "A Close Friend");
                        if(guestName) handleToggleReservationState(activeWl.id, item.id, guestName);
                      }} style={{ background: GRAD_SOFT, border: "none", borderRadius: 10, padding: "0 14px", fontSize: 12, fontWeight: 700, color: C.magenta, cursor: "pointer" }}>
                        {item.reserved ? "Allocated ✓" : "Claim / Coordinate"}
                      </button>
                    </div>
                    {item.reserved && <div style={{ marginTop: 8, fontSize: 11.5, color: C.gold, fontWeight: 700 }}>🎁 Claim registered by: {item.reservedBy}</div>}
                  </div>
                ))}
              </div>
            </div>
          )}

          <Toast text={toast} />
        </div>
      );
    }

    /* =================================================================
       SUB-MODULE RENDERING COMPONENTS (DECOUPLED)
    ================================================================= */
    function WishlistDetailView({ wl, onBack, onSaveItem, onRemoveItem, onDeleteWishlist, notify }) {
      const [isOpen, setIsOpen] = useState(false);
      const [urlInput, setUrlInput] = useState("");
      const [titleInput, setTitleInput] = useState("");
      const [priceInput, setPriceInput] = useState("");

      const executeSave = () => {
        if(!urlInput) return;
        onSaveItem({
          url: urlInput,
          title: titleInput || guessTitle(urlInput),
          price: priceInput || "TBD",
          image: "",
          note: ""
        });
        setUrlInput(""); setTitleInput(""); setPriceInput("");
        setIsOpen(false);
        notify("Product registered directly.");
      };

      const copyWebDeepLink = () => {
        // Formulate universal deployment web string using query patterns for serverless targets
        const trackingLink = `${window.location.origin}${window.location.pathname}?w=${wl.id}`;
        navigator.clipboard.writeText(trackingLink).then(() => {
          notify("Share link copied to device matrix!");
        }).catch(() => {
          alert(`Copy manual token link: ${trackingLink}`);
        });
      };

      return (
        <div style={{ padding: "10px 14px" }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 15 }}>
            <button onClick={onBack} style={{ background: '#F4EEFB', border:'none', padding: 8, borderRadius: 8, cursor: 'pointer' }}>
              <Icon name="ArrowLeft" size={16} />
            </button>
            <h3 style={{ margin:0, fontFamily: DISPLAY_FONT }}>{wl.title}</h3>
            <button onClick={copyWebDeepLink} style={{ background: GRAD, color: '#fff', border:'none', padding: '8px 12px', borderRadius: 8, fontWeight: 600, cursor: 'pointer', display: 'flex', alignItems:'center', gap: 4 }}>
              <Icon name="Share2" size={14} /> Share Link
            </button>
          </div>

          <div style={{ display:'flex', flexDirection:'column', gap: 12, marginBottom: 80 }}>
            {wl.items.map(it => (
              <div key={it.id} style={{ background: '#fff', padding: 12, borderRadius: 14, border: '1.5px solid #F0E6F6' }}>
                <ItemPreview item={it} />
                <div style={{ display:'flex', justifyContent: 'flex-end', gap: 10, marginTop: 10 }}>
                  <button onClick={() => onRemoveItem(it.id)} style={{ background: 'none', border:'none', color: C.danger, cursor:'pointer', fontWeight: 600, fontSize:13 }}>Drop</button>
                </div>
              </div>
            ))}
          </div>

          <div style={{ position:'fixed', bottom: 15, left: '50%', transform: 'translateX(-50%)', width: '90%', maxWidth: 400 }}>
            <GradButton onClick={() => setIsOpen(true)}><Icon name="Plus" size={16} /> Mount Global Item Link</GradButton>
          </div>

          {isOpen && (
            <div style={{ position:'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', zIndex: 1000, display: 'flex', alignItems: 'flex-end' }}>
              <div style={{ background: '#FFF8EE', width: '100%', padding: 20, borderRadius: '20px 20px 0 0', fontFamily: BODY_FONT }}>
                <h4 style={{ margin: '0 0 15px 0' }}>Attach Catalog Link Entry</h4>
                <Field label="Product Page URL">
                  <input value={urlInput} onChange={(e) => setUrlInput(e.target.value)} placeholder="https://..." style={inputStyle(false)} />
                </Field>
                <Field label="Custom Product Name (Optional)">
                  <input value={titleInput} onChange={(e) => setTitleInput(e.target.value)} placeholder="Leave blank to auto-guess" style={inputStyle(false)} />
                </Field>
                <Field label="Target Pricing Notation">
                  <input value={priceInput} onChange={(e) => setPriceInput(e.target.value)} placeholder="e.g. ₹1,200 or $45" style={inputStyle(false)} />
                </Field>
                <div style={{ display: 'flex', gap: 10, marginTop: 10 }}>
                  <button onClick={() => setIsOpen(false)} style={{ flex:1, padding: 12, borderRadius: 10, border: '1.5px solid #ccc', background: 'none', cursor: 'pointer' }}>Cancel</button>
                  <button onClick={executeSave} style={{ flex:1, padding: 12, borderRadius: 10, border: 'none', background: GRAD, color:'#fff', fontWeight:600, cursor: 'pointer' }}>Save Product</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const rootElement = document.getElementById("root");
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
